# La version del APK que sale al reloj.
#
# versionCode es un entero MONOTONO: uno por build instalado. No es cosmetico --el instalador
# de Android rechaza un APK con versionCode menor al instalado-- y es la misma trampa que
# devpack.py ya evita para los packs comparando data_version. Arranca en 2: el 1 era el literal
# del template, que nunca subio nadie.
#
# versionName es para personas y no lo lee ninguna maquina. Arranca en 0.2.0 porque "1.0" era
# mentira: no hay release firmado ni publicado.
#
# Viven aca y no en el .kts para que subirlos sea una linea que no toca logica de build. El .kts
# los lee con un default, asi que un clone sin estas properties sigue compilando (D-086).
# No se derivan de git: `git rev-list --count` rompe en un tarball sin .git.
#
# It jumps 5 -> 8 and the gap is explained: codes 6 and 7 were installed on the emulator on
# 2026-09-23 to verify that installing a new version expires the memo of verified packs (D-225,
# P-7 and P-8 of the brief). They are builds that existed on a device, so reusing them would
# make that emulator reject the APK as a downgrade -- which is exactly the trap this number
# exists to avoid. A gap in the sequence costs nothing; a repeated number costs an install that
# fails without saying why.
#
# 8 -> 9 because a BUNDLED pack was repaired. `assetsToExtract` skips the comparison entirely
# when `last == current`, on the stated assumption that the same APK carries the same content --
# true for every build until `repair_meta.py` made it possible to change a pack's bytes without
# touching a line of Kotlin. A repaired core inside an unchanged versionCode is invisible:
# verified on the emulator, the app went on opening the old `en-core` and logged nothing.
dictionary.versionCode=11
dictionary.versionName=0.7.0
