[versions]

# ── Build ─────────────────────────────────────────────────────────────────────
agp = "9.4.1"
kotlin = "2.4.20"

# ── Wear UI, for :app ─────────────────────────────────────────────────────────
# One ref per RELEASE TRAIN and not per groupId: `androidx.wear` holds
# wear-tooling-preview and wear-input at different versions, so a single
# `androidx.wear` ref would be a lie. The trains below do ship in lockstep.
composeBom = "2026.09.00"
wearCompose = "1.6.2"
wearTooling = "1.0.0"
wearInput = "1.2.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"

# ── Tiles and Protolayout, for :app ───────────────────────────────────────────
wearTiles = "1.6.2"
protolayout = "1.4.2"
guava = "33.7.1-android"
watchfaceComplicationsDataSourceKtx = "1.3.0"

# ── Android platform, for :app ────────────────────────────────────────────────
coreKtx = "1.18.0"
coreSplashscreen = "1.2.0"

# ── Packs and background work, for :dict-data and :app ────────────────────────
# Deliberately stable: sqlite 2.8.0-alpha01 and work 2.12.0-rc01 exist and are
# NOT used, because the pack reader and the installer are on the product's
# critical path (D-032).
sqliteBundled = "2.7.1"
work = "2.11.2"
coroutines = "1.11.0"

# ── Tests ─────────────────────────────────────────────────────────────────────
# :dict-core takes only the two test runners and nothing in production, which is
# what `check_core_dependencies` in the audit holds.
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
# Pinned by hand and on purpose: ui-test-junit4 drags it in at 3.5.0 (2022),
# whose reflection over InputManager.getInstance no longer exists in Android 17.
# Without this, EVERY test doing performClick or performTextInput blows up on
# API 37 -- the watch's level (D-023, D-093).
espresso = "3.7.0"
robolectric = "4.16.1"

[libraries]

# ── Compose, versioned by the BOM ─────────────────────────────────────────────
# These carry no version.ref on purpose: `compose-bom` fixes them. Adding one
# would take them off the train the rest of Compose rides.
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
ui = { group = "androidx.compose.ui", name = "ui" }
ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }

# ── Wear UI, for :app ─────────────────────────────────────────────────────────
compose-material3 = { group = "androidx.wear.compose", name = "compose-material3", version.ref = "wearCompose" }
compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
compose-ui-tooling = { group = "androidx.wear.compose", name = "compose-ui-tooling", version.ref = "wearCompose" }
wear-compose-navigation = { group = "androidx.wear.compose", name = "compose-navigation", version.ref = "wearCompose" }
wear-tooling-preview = { group = "androidx.wear", name = "wear-tooling-preview", version.ref = "wearTooling" }
wear-input = { group = "androidx.wear", name = "wear-input", version.ref = "wearInput" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# ── Tiles and Protolayout, for :app ───────────────────────────────────────────
tiles = { group = "androidx.wear.tiles", name = "tiles", version.ref = "wearTiles" }
tiles-renderer = { group = "androidx.wear.tiles", name = "tiles-renderer", version.ref = "wearTiles" }
tiles-tooling = { group = "androidx.wear.tiles", name = "tiles-tooling", version.ref = "wearTiles" }
tiles-tooling-preview = { group = "androidx.wear.tiles", name = "tiles-tooling-preview", version.ref = "wearTiles" }
protolayout = { group = "androidx.wear.protolayout", name = "protolayout", version.ref = "protolayout" }
protolayout-material3 = { group = "androidx.wear.protolayout", name = "protolayout-material3", version.ref = "protolayout" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
watchface-complications-data-source-ktx = { group = "androidx.wear.watchface", name = "watchface-complications-data-source-ktx", version.ref = "watchfaceComplicationsDataSourceKtx" }

# ── Android platform, for :app ────────────────────────────────────────────────
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }

# ── Packs and background work, for :dict-data and :app ────────────────────────
sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqliteBundled" }
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# ── Tests ─────────────────────────────────────────────────────────────────────
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
