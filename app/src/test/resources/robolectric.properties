# Robolectric 4.16.1 llega hasta SDK 36 y este proyecto targetea 37 (D-023). Sin esta linea todo
# test falla al arrancar con "Package targetSdkVersion=37 > maxSdkVersion=36".
#
# LA CONSECUENCIA HAY QUE TENERLA PRESENTE: estos tests NO corren en el nivel de API del reloj.
# Lo que dependa de API 37 --y este proyecto ya tuvo un caso, la inyeccion de input que obligo a
# fijar espresso 3.7.0 (D-093)-- sigue necesitando los tests en dispositivo.
sdk=36

# Los tests corren en ESPAÑOL, y es una decision con vuelta atras de una linea (D-127).
#
# La base de recursos es ingles (`values/`) y el fallback de Android es esa. Sin fijar el locale,
# los ~40 tests que afirman texto literal --"Ver mas", "Guardadas"-- resolverian `values/` y
# fallarian en bloque. Fijandolo en es, esos tests siguen describiendo LA PANTALLA QUE EL USUARIO
# VE, que es lo que un test de pantalla tiene que describir.
#
# El costo es que la base en ingles no se ejercita por defecto: lo cubren los pocos tests que
# fijan `qualifiers = "en"` a mano.
qualifiers=es
